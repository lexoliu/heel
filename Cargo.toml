[workspace]
members = [".", "nodejs"]

# Lints are configured once for the workspace so the library, the CLI and the
# Node bindings are all held to the same standard.
# Release profile lives at the workspace root; cargo ignores profiles declared
# by non-root members.
[profile.release]
lto = true
strip = "symbols"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
# Correctness and clarity, tuned for a crate whose job is enforcing boundaries.
undocumented_unsafe_blocks = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"

[package]
name = "heel"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Cross-platform native sandboxing library for running untrusted code"
repository = "https://github.com/lexoliu/heel"
keywords = ["sandbox", "security", "isolation", "python", "venv"]
categories = ["os", "development-tools"]

[[bin]]
name = "heel"
path = "src/bin/heel/main.rs"

[features]
default = ["python"]
python = ["which"]

[lints]
workspace = true

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
# Serialization for IPC
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
toml = "0.8"

# Error handling
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
humantime = "2"

# HTTP proxy
hyper = { version = "1", features = ["http1", "server", "client"] }
http-body-util = "0.1"
bytes = "1.11.1"

# Runtime-agnostic async (smol-based by default)
executor-core = { version = "0.7", features = ["smol", "std"] }
async-net = "2"
futures-lite = "2"
blocking = "1"
smol = "2"

# Compile-time templates
askama = "0.12"
shell-escape = "0.1"

# Terminal raw mode
crossterm = "0.29"

# I/O polling for non-blocking operations
polling = "3"

# Random number generation
rand = "0.8"

# Directory operations
remove_dir_all = "0.8"
smol-hyper = "0.1.1"
async-channel = "2.5.0"
interprocess = { version = "2", default-features = false }
dunce = "1.0.5"

# Unix process management
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# PTY support for interactive shells
[target.'cfg(target_os = "macos")'.dependencies]
pty-process = "0.5"

# Python executable detection (optional)
[dependencies.which]
version = "7"
optional = true

# Linux-specific dependencies
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
seccompiler = "0.4"

# Windows-specific dependencies
[target.'cfg(target_os = "windows")'.dependencies]
# AppContainer profiles, capability SIDs, ACL grants, container launch and the
# loopback exemption the proxy needs.
rappct = { version = "0.13.3", features = ["net", "tracing"] }
# Kept on the version rappct exposes in its own API: a handle from one version
# of the `windows` crate is a different type from the same handle in another.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
executor-core = { version = "0.7", features = ["tokio"] }
tempfile = "3"
# Surfaces the launcher's own diagnostics when a Windows test fails.
tracing-subscriber = { version = "0.3", features = ["fmt"] }
