name: Test

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04 ships a kernel with Landlock ABI v4, which the Linux
        # backend requires.
        #
        # Both Linux architectures run, because the seccomp filter is written
        # per architecture: a rule compiled in on x86_64 and compiled out on
        # aarch64 leaves a hole that nothing else here would show. That is not
        # hypothetical -- `clone3` went unfiltered on aarch64 exactly that way.
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-${{ matrix.os }}

      - name: Build
        run: cargo build --verbose --all-features

      # The isolation suite runs real programs in real sandboxes and asserts
      # that forbidden operations fail, so it is the check that matters most
      # here; it is part of the test run rather than a separate example.
      # nextest runs each test in its own process and always runs the whole
      # list, so one failing binary cannot hide the suites that assert what
      # the sandbox denies.
      - uses: taiki-e/install-action@nextest
      - name: Test
        run: cargo nextest run --all-features
        env:
          # The backends report a refused launch through one opaque error; their
          # traces name the step that actually failed.
          RUST_LOG: heel=debug,rappct=trace
      - name: Doctests
        run: cargo test --doc --all-features

      - name: Examples build
        run: cargo build --examples --all-features
