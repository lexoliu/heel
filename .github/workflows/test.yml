name: Test

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04 ships a kernel with Landlock ABI v4, which the Linux
        # backend requires.
        #
        # Both Linux architectures run, because the seccomp filter is written
        # per architecture: a rule compiled in on x86_64 and compiled out on
        # aarch64 leaves a hole that nothing else here would show. That is not
        # hypothetical -- `clone3` went unfiltered on aarch64 exactly that way.
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-${{ matrix.os }}

      - name: Build
        run: cargo build --verbose --all-features

      - name: Diagnose macOS TLS trust (temporary, heel#166)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          ./target/debug/heel run --network allow --isolation default -- /usr/bin/curl -sS -v -o /dev/null https://example.com 2>&1 | tail -25 || true
          echo "--- sandbox denials"
          /usr/bin/log show --last 3m --style compact --predicate 'eventMessage CONTAINS "deny(" AND (eventMessage CONTAINS "curl" OR eventMessage CONTAINS "trustd" OR eventMessage CONTAINS "heel")' 2>&1 | tail -60
          echo "--- keychains and trust settings"
          ls -la /Library/Keychains ~/Library/Keychains 2>&1 | head -30
          security dump-trust-settings -d 2>&1 | head -10
          security dump-trust-settings 2>&1 | head -10

      - name: Native Windows sandbox launch
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ./target/debug/heel.exe run --network deny --working-dir "$env:RUNNER_TEMP/heel-native-preflight" -- cmd.exe /D /S /C "echo native-sandbox-ready"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          RUST_LOG: heel=debug,rappct=trace

      # The isolation suite runs real programs in real sandboxes and asserts
      # that forbidden operations fail, so it is the check that matters most
      # here; it is part of the test run rather than a separate example.
      # nextest runs each test in its own process and always runs the whole
      # list, so one failing binary cannot hide the suites that assert what
      # the sandbox denies.
      - uses: taiki-e/install-action@nextest
        if: ${{ !cancelled() }}
      - name: Test
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: cargo nextest run --all-features --no-fail-fast --config-file .devin/nextest.toml --profile ci
        env:
          # The backends report a refused launch through one opaque error; their
          # traces name the step that actually failed.
          RUST_LOG: heel=debug,rappct=trace
      - name: Doctests
        run: cargo test --doc --all-features

      - name: Examples build
        run: cargo build --examples --all-features
