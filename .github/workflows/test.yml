name: Test

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04 ships a kernel with Landlock ABI v4, which the Linux
        # backend requires.
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-${{ matrix.os }}

      - name: Build
        run: cargo build --verbose --all-features

      # The isolation suite runs real programs in real sandboxes and asserts
      # that forbidden operations fail, so it is the check that matters most
      # here; it is part of `cargo test` rather than a separate example.
      - name: Test
        run: cargo test --verbose --all-features

      - name: Examples build
        run: cargo build --examples --all-features
