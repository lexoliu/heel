name: CI

permissions:
  contents: read
  checks: write
  id-token: write

on:
  # Topic branches are tested through their pull request. A push trigger on
  # every branch ran the whole workflow a second time for each commit of an
  # open pull request, so pushes run it only where no pull request does.
  push:
    branches: [dev, main]
  pull_request:
    branches: ["**"]
  # A push whose webhook is dropped -- during a GitHub incident, say -- leaves a
  # commit with no run and no way to ask for one. This makes CI startable by
  # hand for any ref.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # A release-plz bump changes workspace versions and the changelog and
  # nothing else, so it cannot change what a compiler, a test or an audit
  # observes beyond the version string, and the jobs that build or audit the
  # crate skip it. Typos still reads the changelog it wrote. The script reads
  # the diff rather than the branch name: code pushed onto a release branch
  # runs every job. A job skipped by `if:` reports success.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.bump.outputs.only != 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version-only diff
        id: bump
        if: github.event_name != 'workflow_dispatch'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          only=$(python3 -I .github/scripts/version-only.py "$(git merge-base "$BASE" "$HEAD")" "$HEAD")
          echo "only=$only" >> "$GITHUB_OUTPUT"

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-ubuntu
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings

  # The `lint` job runs on x86_64 Linux, where `cfg(target_os = "windows")` and
  # the aarch64 arms of the seccomp filter compile to nothing: the code hardest
  # to check by hand is the code the lint gate never sees, and it accumulated
  # dead helpers unnoticed. `cargo clippy` needs a target's standard library but
  # never links, so both are lintable from this runner without a Windows one.
  cross-lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Cross-target Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-pc-windows-msvc, aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-cross
      - name: Clippy (Windows)
        run: cargo clippy --target x86_64-pc-windows-msvc --all-targets --all-features -- -D warnings
      - name: Clippy (Linux aarch64)
        run: cargo clippy --target aarch64-unknown-linux-gnu --all-targets --all-features -- -D warnings

  coverage:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-ubuntu
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@nextest
      - run: cargo llvm-cov nextest --all-features --workspace --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v5.5.4
        with:
          use_oidc: true
          fail_ci_if_error: false
  typos:
    name: Typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crate-ci/typos@v1

  audit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Cargo.lock
        run: cargo generate-lockfile
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-ubuntu
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  unused-deps:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Unused Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-ubuntu
      - uses: taiki-e/install-action@cargo-machete
      - run: cargo machete

  feature-checks:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-ubuntu
      - uses: taiki-e/install-action@cargo-hack
      - run: cargo hack check --each-feature --no-dev-deps
      - run: cargo hack check --feature-powerset --no-dev-deps

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Test
    uses: ./.github/workflows/test.yml
