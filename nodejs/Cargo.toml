[package]
name = "heel-nodejs"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Node.js bindings for heel sandbox library"
publish = false

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
# Core heel library
heel = { path = ".." }

# NAPI-RS for Node.js bindings
napi = { version = "2", default-features = false, features = [
    "async",
    "tokio_rt",
    "serde-json",
    "napi6",
] }
napi-derive = "2"

# Async runtime (required for NAPI tokio_rt)
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
executor-core = { version = "0.7", features = ["tokio"] }

[build-dependencies]
napi-build = "2"

